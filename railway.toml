# Railway config shared by every service deployed from this repo. Each service
# sets SERVICE_ROLE (web | landing) and the build/start scripts branch on it.
# The `db` service is not built from this repo — it runs the
# ghcr.io/tursodatabase/libsql-server image with a volume. See RAILWAY.md.

[build]
builder = "NIXPACKS"
buildCommand = "bash scripts/railway-build.sh"

[deploy]
startCommand = "bash scripts/railway-start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
