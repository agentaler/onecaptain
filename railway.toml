# Railway service config for `web` (the only service until Phase 2).
# Phase 0 runtime: the dev-parity stack via scripts/railway-phase0.sh —
# replaced by `next build && next start` when the Phase 1 Node port lands.
# See RAILWAY.md.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile"

[deploy]
startCommand = "bash scripts/railway-phase0.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
